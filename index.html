"hide"></section><script>
(function(){
  const key='servicios-color-theme';
  let mode='light';
  try{mode=localStorage.getItem(key)==='dark'?'dark':'light'}catch(e){}
  const button=document.getElementById('themeSwitch');
  const palette={verde:'#185c35',rojo:'#ae3038',azul:'#245ea5',naranja:'#b75a15',violeta:'#7043a3',negro:'#34383d'};
  function validColor(c){return /^#[0-9a-fA-F]{6}$/.test(c||'')?c:palette.verde}
  window.setServiciosColor=function(c){c=validColor(c);document.documentElement.style.setProperty('--brand',c);document.documentElement.style.setProperty('--brand-button',c);document.documentElement.style.setProperty('--brand-soft',c+'22');document.documentElement.style.setProperty('--brand-ink',c);const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=c;try{localStorage.setItem('servicios-accent',c)}catch(e){};document.querySelectorAll('.color-choice').forEach(b=>b.classList.toggle('selected',b.dataset.color===c));};
  window.serviciosPalette=palette;
  window.getServiciosColor=function(){try{return validColor(localStorage.getItem('servicios-accent'))}catch(e){return palette.verde}};
  function apply(){document.documentElement.dataset.theme=mode;button.textContent=mode==='dark'?'☀️ Claro':'🌙 Oscuro';window.setServiciosColor(window.getServiciosColor())}
  button.addEventListener('click',function(){mode=mode==='dark'?'light':'dark';try{localStorage.setItem(key,mode)}catch(e){}apply()});
  apply();
})();

iales de bolas"], ["51101", 12, 26, 9, "Axiales de bolas"], ["51102", 15, 28, 9, "Axiales de bolas"], ["51103", 17, 30, 9, "Axiales de bolas"], ["51104", 20, 35, 10, "Axiales de bolas"], ["51105", 25, 42, 11, "Axiales de bolas"], ["51106", 30, 47, 11, "Axiales de bolas"], ["51107", 35, 52, 12, "Axiales de bolas"], ["51108", 40, 60, 13, "Axiales de bolas"], ["51109", 45, 65, 14, "Axiales de bolas"], ["51110", 50, 70, 14, "Axiales de bolas"]];
function campoBearings(){return title('⭕ Rodamientos','Buscador offline por código y dimensiones')+campoCard('Buscar rodamientos',`<label>Código o medida (ej. 6205, 25x52x15)</label><input id="bearingSearch" oninput="campoBearingSearch()" placeholder="Código o medidas"><label>Familia</label><select id="bearingFamily" onchange="campoBearingSearch()"><option value="">Todas</option><option>Bolas rígidas</option><option>Rodillos cónicos</option><option>Axiales de bolas</option></select><div id="bearingResults"></div><p class="muted">Referencias dimensionales seleccionadas para consulta. No es un catálogo exhaustivo de Argentina. Comprobá ficha del fabricante, tolerancias, cargas, sellos, juego y compatibilidad antes de reemplazar.</p>`)+campoDetails('Otras familias y códigos habituales',`<p>Contacto angular: 7000, 7200, 7300. Autoalineantes: 1200, 1300, 2200, 2300. Rodillos a rótula: 21300, 22200, 22300. Cilíndricos: NU, NJ, NUP. Agujas: HK, BK, NK, NA. Unidades: UC, UCP, UCF, UCFL. Agrícolas: insertos y unidades específicas por máquina.</p><p>Estas familias se incluyen como guía de identificación; sus dimensiones particulares deben verificarse en el catálogo del fabricante.</p>`)+campoDetails('Sufijos frecuentes','2RS: sellos de contacto en ambos lados (la designación exacta varía por marca). ZZ/2Z: dos blindajes metálicos. C3: juego interno mayor que normal. K: agujero cónico. NR: ranura y anillo de retención. Los sufijos y equivalencias dependen del fabricante.')}
function campoBearingSearch(){let q=(document.getElementById('bearingSearch')?.value||'').toLowerCase().replace(/\s/g,''),family=document.getElementById('bearingFamily')?.value||'',el=document.getElementById('bearingResults');if(!el)return;let matches=rodamientosV40.filter(r=>(!family||r[4]===family)&&(!q||r[0].toLowerCase().includes(q)||`${r[1]}x${r[2]}x${r[3]}`.includes(q))).slice(0,80);el.innerHTML=matches.length?`<p class="muted">${matches.length} coincidencias mostradas (máximo 80)</p><div style="overflow-x:auto"><table style="width:100%;text-align:left"><tr><th>Código</th><th>Familia</th><th>Interior</th><th>Exterior</th><th>Ancho total</th></tr>${matches.map(r=>`<tr><td>${r[0]}</td><td>${r[4]}</td><td>${r[1]} mm</td><td>${r[2]} mm</td><td>${r[3]} mm</td></tr>`).join('')}</table></div>`:'<p>Sin coincidencias en la selección disponible.</p>'}
const energia40Key='servicios_energia_v40';
function energia40Read(){try{const d=JSON.parse(localStorage.getItem(energia40Key)||'{}');return {cap:Number(d.cap)||0,charge:d.charge===undefined?100:Number(d.charge),panels:Number(d.panels)||0,sun:Number(d.sun)||0,solarEff:d.solarEff===undefined?80:Number(d.solarEff),batteryEff:d.batteryEff===undefined?85:Number(d.batteryEff),devices:Array.isArray(d.devices)?d.devices:[]}}catch(e){return {cap:0,charge:100,panels:0,sun:0,solarEff:80,batteryEff:85,devices:[]}}}
function energia40Save(d){try{localStorage.setItem(energia40Key,JSON.stringify(d))}catch(e){alert('No se pudo guardar la configuración. Revisá el espacio disponible.')}}
function energia40(){let d=energia40Read();return title('⚡ Energía y conectividad','Calculadora offline de baterías, paneles solares y consumos, incluido Starlink')+campoCard('Sistema de energía',`<label>Capacidad total de baterías (Wh)</label><input type="number" min="0" id="enCap" value="${d.cap}" oninput="energia40Update()"><label>Carga actual (%)</label><input type="number" min="0" max="100" id="enCharge" value="${d.charge}" oninput="energia40Update()"><label>Potencia total de paneles (W)</label><input type="number" min="0" id="enPanels" value="${d.panels}" oninput="energia40Update()"><label>Horas solares pico por día</label><input type="number" min="0" max="24" step="0.5" id="enSun" value="${d.sun}" oninput="energia40Update()"><label>Rendimiento solar estimado (%)</label><input type="number" min="1" max="100" id="enSolarEff" value="${d.solarEff}" oninput="energia40Update()"><label>Rendimiento de batería e inversor (%)</label><input type="number" min="1" max="100" id="enBatteryEff" value="${d.batteryEff}" oninput="energia40Update()">`)+campoCard('Mis aparatos (lista inicialmente vacía)',`<div id="enDevices"></div><label>Nombre del aparato</label><input id="enName" placeholder="Ej. Starlink, heladera, aire acondicionado"><label>Potencia eléctrica (W)</label><input id="enW" type="number" min="0" step="any" placeholder="Potencia real"><label>Horas de uso por día (0 a 24)</label><input id="enH" type="number" min="0" max="24" step="any" placeholder="Horas"><button class="full" onclick="energia40Add()">+ Agregar aparato</button>`)+campoCard('Resultados estimados',`<div id="enResults"></div><p class="muted">La autonomía sin sol supone consumo constante de los equipos marcados como encendidos. El consumo diario utiliza las horas configuradas. No incluye picos de arranque, temperatura, degradación ni límites del inversor. La generación solar es orientativa; no equivale a un pronóstico.</p>`)}
function energia40Update(){let d=energia40Read();for(let [key,id] of [['cap','enCap'],['charge','enCharge'],['panels','enPanels'],['sun','enSun'],['solarEff','enSolarEff'],['batteryEff','enBatteryEff']]){let e=document.getElementById(id);if(e)d[key]=Math.max(0,Number(e.value)||0)}d.charge=Math.min(100,d.charge);d.sun=Math.min(24,d.sun);d.solarEff=Math.min(100,d.solarEff);d.batteryEff=Math.min(100,d.batteryEff);energia40Save(d);energia40Calc()}
function energia40Add(){let n=document.getElementById('enName').value.trim(),w=Number(document.getElementById('enW').value),h=Number(document.getElementById('enH').value);if(!n||!Number.isFinite(w)||w<=0||!Number.isFinite(h)||h<0||h>24){alert('Ingresá nombre, potencia positiva y horas entre 0 y 24.');return}let d=energia40Read();d.devices.push({id:Date.now()+Math.random(),name:n.slice(0,100),w,h,on:true});energia40Save(d);document.getElementById('enName').value='';document.getElementById('enW').value='';document.getElementById('enH').value='';energia40Calc()}
function energia40Remove(id){let d=energia40Read();d.devices=d.devices.filter(x=>String(x.id)!==String(id));energia40Save(d);energia40Calc()}
function energia40Toggle(id,checked){let d=energia40Read(),x=d.devices.find(x=>String(x.id)===String(id));if(x)x.on=checked;energia40Save(d);energia40Calc()}
function energia40Edit(id){let d=energia40Read(),x=d.devices.find(x=>String(x.id)===String(id));if(!x)return;let n=prompt('Nombre',x.name);if(n===null)return;let w=prompt('Potencia en W',x.w);if(w===null)return;let h=prompt('Horas diarias (0 a 24)',x.h);if(h===null)return;w=Number(w);h=Number(h);if(!n.trim()||!(w>0)||!(h>=0&&h<=24)){alert('Datos no válidos');return}Object.assign(x,{name:n.trim().slice(0,100),w,h});energia40Save(d);energia40Calc()}
function energia40Calc(){let d=energia40Read(),list=document.getElementById('enDevices'),out=document.getElementById('enResults');if(!out||!list)return;const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));list.innerHTML=d.devices.length?d.devices.map(x=>`<div class="listitem"><label><input type="checkbox" ${x.on?'checked':''} onchange="energia40Toggle('${x.id}',this.checked)"> ${escapeText(x.name)} · ${x.w} W · ${x.h} h/día</label><button class="secondary tiny" onclick="energia40Edit('${x.id}')">Editar</button> <button class="secondary tiny" onclick="energia40Remove('${x.id}')">Eliminar</button></div>`).join(''):'<p class="muted">No hay aparatos cargados.</p>';let active=d.devices.filter(x=>x.on),watts=active.reduce((s,x)=>s+x.w,0),daily=d.devices.reduce((s,x)=>s+x.w*x.h,0),usable=d.cap*d.charge/100*d.batteryEff/100,solar=d.panels*d.sun*d.solarEff/100,fmt=x=>x.toLocaleString('es-AR',{maximumFractionDigits:2});out.innerHTML=`<p><b>Potencia encendida:</b> ${fmt(watts)} W</p><p><b>Consumo diario configurado:</b> ${fmt(daily/1000)} kWh</p><p><b>Energía disponible:</b> ${fmt(usable/1000)} kWh</p><p><b>Autonomía sin sol:</b> ${watts?fmt(usable/watts)+' horas':'— (sin equipos encendidos)'}</p><p><b>Generación solar estimada:</b> ${fmt(solar/1000)} kWh/día</p><p><b>Balance solar diario:</b> ${fmt((solar-daily)/1000)} kWh/día</p>`}
